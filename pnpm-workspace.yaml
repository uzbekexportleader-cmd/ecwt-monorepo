packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11: postinstall skriptlariga aniq ruxsat (Prisma engine, esbuild va h.k.)
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  # Sentry CLI binarysi: build paytida source map yuklash uchun kerak —
  # busiz Sentry'da stack trace minifikatsiya qilingan holda ko'rinadi
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - expo-file-system@57.0.7
  - expo-location@57.0.17

# pnpm 11: sozlamalar .npmrc dan shu yerga ko'chgan.
# hoisted linker SHART — .pnpm/<paket>@<versiya>_<hash>/node_modules/ tuzilishi
# yo'lga ~90 belgi qo'shadi va Android C++ (CMake/ninja) 250 belgilik
# obyekt-fayl chegarasidan oshib ketadi.
nodeLinker: hoisted
